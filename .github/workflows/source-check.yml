name: Source reachability
on:
  schedule:
    - cron: '17 6 1 * *'  # monthly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Check official sources resolve (not content verification)
        run: python tools/check_sources.py skills/production-ai-design-review/references/source-policy.md
