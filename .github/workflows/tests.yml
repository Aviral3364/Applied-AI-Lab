name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and skill conformance tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate shipped example report
        run: python skills/production-ai-design-review/scripts/review_tools.py validate skills/production-ai-design-review/assets/example-review.json
      - name: Doc line-length lint
        run: python tools/lint_docs.py
