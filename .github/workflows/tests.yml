name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and skill conformance tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate shipped example report
        run: python skills/production-ai-design-review/scripts/review_tools.py validate skills/production-ai-design-review/assets/example-review.json
      - name: Doc line-length lint
        run: python tools/lint_docs.py
